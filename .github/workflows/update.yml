name: Archive policy and publish RSS
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'collect: 抓取并发布；publish: 仅发布已核实的数据'
        type: choice
        options: [collect, publish]
        default: collect
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: policy-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: inputs.mode == 'collect'
        run: pip install -r requirements.txt
      - if: inputs.mode == 'collect'
        run: python -m playwright install --with-deps chromium
      - if: inputs.mode == 'collect'
        run: python -u collect.py
      - name: Persist archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data public
          if ! git diff --cached --quiet; then
            git commit -m 'Update public policy archive'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy RSS
        id: deployment
        uses: actions/deploy-pages@v4
